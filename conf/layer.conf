BBFILES += "${LAYERDIR}/recipes/*/*.bb ${LAYERDIR}/recipes/*/*.bbappend ${LAYERDIR}/recipes-*/*.bb ${LAYERDIR}/recipes-*/*.bbappend"
BBPATH .= ":${LAYERDIR}"
BBFILE_COLLECTIONS += "auto-sepolicy"
BBFILE_PRIORITY_auto-sepolicy = "12"
BBFILE_PATTERN_auto-sepolicy := "^${LAYERDIR}/"

LAYERSERIES_COMPAT_auto-sepolicy = "kirkstone"
